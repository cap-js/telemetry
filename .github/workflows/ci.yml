name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NPM_CONFIG_IGNORE_SCRIPTS: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm i
      - run: npm run lint
      - run: npm run format:check
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 22.x]
        cds-version: [10, 9]
        otel-version: [2, 3]
    env:
      TELEMETRY_TEST_OTEL_VERSION: ${{ matrix.otel-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm ci
      - run: node scripts/install-otel.js ${{ matrix.otel-version }} ${{ matrix.cds-version }}
      - run: if [ ${{ matrix.cds-version }} -eq 9 ]; then npm explore better-sqlite3 -- npm run install; fi
      - run: cds v
      - run: npm run test
